<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #1e3c72;
            --secondary-color: #2a5298;
            --accent-color: #3498db;
            --button-primary: #3498db;
            --button-secondary: #2ecc71;
            --text-color: white;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 10px;
            transition: all 0.5s ease;
        }

        .tms-container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            padding: 2rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .tms-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            z-index: -1;
        }

        .theme-selector {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-width: 120px;
            justify-content: flex-end;
        }

        .theme-btn {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .theme-btn:hover {
            transform: scale(1.3);
        }

        .theme-btn.active {
            border-color: white;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
        }

        /* Blue Theme Colors */
        .theme-midnight {
            background: linear-gradient(135deg, #0f1b3a, #1c3b6a);
        }

        .theme-navy {
            background: linear-gradient(135deg, #001f3f, #003366);
        }

        .theme-royal {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .theme-sapphire {
            background: linear-gradient(135deg, #082567, #0d4b9c);
        }

        .theme-ocean {
            background: linear-gradient(135deg, #005b96, #0077be);
        }

        .theme-sky {
            background: linear-gradient(135deg, #0077be, #0096ff);
        }

        .theme-steel {
            background: linear-gradient(135deg, #4682b4, #5f9ea0);
        }

        .theme-azure {
            background: linear-gradient(135deg, #007fff, #00bfff);
        }

        .theme-cobalt {
            background: linear-gradient(135deg, #0047ab, #1e90ff);
        }

        .theme-denim {
            background: linear-gradient(135deg, #1560bd, #1e90ff);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.8rem;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            color: var(--text-color);
        }

        .subtitle {
            font-size: 1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .tms-btn {
            padding: 1rem 2rem;
            font-size: 1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .tms-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: all 0.6s ease;
        }

        .tms-btn:hover::before {
            left: 100%;
        }

        .tms-btn-primary {
            background: linear-gradient(45deg, var(--button-primary), color-mix(in srgb, var(--button-primary) 80%, black));
            color: white;
        }

        .tms-btn-secondary {
            background: linear-gradient(45deg, var(--button-secondary), color-mix(in srgb, var(--button-secondary) 80%, black));
            color: white;
        }

        .tms-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .tms-btn:active {
            transform: translateY(0);
        }

        .truck-icons {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: nowrap;
            gap: 0.5rem;
            margin: 2rem 0;
        }

        .truck-icon {
            font-size: 2.5rem;
            color: white;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
            flex: 1;
            text-align: center;
        }

        .truck-icon:nth-child(1) {
            animation-delay: 0s;
        }

        .truck-icon:nth-child(2) {
            animation-delay: 0.5s;
        }

        .truck-icon:nth-child(3) {
            animation-delay: 1s;
        }

        .truck-icon:nth-child(4) {
            animation-delay: 1.5s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-10px) rotate(3deg);
            }
        }

        .truck-icon:hover {
            animation: pulse 0.5s ease-in-out, glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
            }
            to {
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.7));
            }
        }

        .road {
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            margin: 1.5rem 0;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .road::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            animation: roadShine 3s infinite;
        }

        @keyframes roadShine {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .feature {
            background: rgba(255, 255, 255, 0.15);
            padding: 1rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-width: 0;
        }

        .feature:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .feature i {
            font-size: 1.8rem;
            margin-bottom: 0.8rem;
            color: white;
        }

        .feature h3 {
            font-size: 0.95rem;
            margin-bottom: 0.4rem;
        }

        .feature p {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Tablet Styles */
        @media (min-width: 769px) {
            h1 {
                font-size: 3rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
                margin-bottom: 3rem;
            }
            
            .tms-btn {
                padding: 1.2rem 2.5rem;
                font-size: 1.1rem;
            }
            
            .truck-icon {
                font-size: 3.5rem;
            }
            
            .features {
                grid-template-columns: repeat(4, 1fr);
                gap: 1.5rem;
                margin-top: 2rem;
            }
            
            .feature {
                padding: 1.5rem;
            }
            
            .feature i {
                font-size: 2.5rem;
            }
            
            .feature h3 {
                font-size: 1.1rem;
            }
            
            .feature p {
                font-size: 0.9rem;
            }
        }

        /* For very small mobile screens */
        @media (max-width: 350px) {
            .tms-container {
                padding: 1.5rem 1rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .truck-icon {
                font-size: 2rem;
            }
            
            .tms-btn {
                padding: 0.8rem 1.5rem;
                font-size: 0.9rem;
            }
            
            .theme-selector {
                max-width: 100px;
            }
            
            .theme-btn {
                width: 14px;
                height: 14px;
            }
        }
    </style>
</head>
<body class="theme-royal">
    <div class="tms-container">
        <div class="theme-selector">
            <div class="theme-btn theme-midnight active" data-theme="midnight" title="Midnight Blue"></div>
            <div class="theme-btn theme-navy" data-theme="navy" title="Navy Blue"></div>
            <div class="theme-btn theme-royal" data-theme="royal" title="Royal Blue"></div>
            <div class="theme-btn theme-sapphire" data-theme="sapphire" title="Sapphire Blue"></div>
            <div class="theme-btn theme-ocean" data-theme="ocean" title="Ocean Blue"></div>
            <div class="theme-btn theme-sky" data-theme="sky" title="Sky Blue"></div>
            <div class="theme-btn theme-steel" data-theme="steel" title="Steel Blue"></div>
            <div class="theme-btn theme-azure" data-theme="azure" title="Azure Blue"></div>
            <div class="theme-btn theme-cobalt" data-theme="cobalt" title="Cobalt Blue"></div>
            <div class="theme-btn theme-denim" data-theme="denim" title="Denim Blue"></div>
        </div>
        
        <h1><i class="fas fa-truck-moving"></i> Truck Management System</h1>
        <p class="subtitle">Efficient logistics and fleet management solutions</p>
        
        <div class="truck-icons">
            <div class="truck-icon"><i class="fas fa-gas-pump"></i></div>
            <div class="truck-icon"><i class="fas fa-money-bill-wave"></i></div>
            <div class="truck-icon"><i class="fas fa-truck-pickup"></i></div>
            <div class="truck-icon"><i class="fas fa-users"></i></div>
        </div>
        
        <div class="road"></div>
        
        <div class="button-group">
            <button onclick="window.location.href='employee/index.html'" class="tms-btn tms-btn-primary">
                <i class="fas fa-user-tie"></i> Employee Portal
            </button>
           <button onclick="window.location.href='admin/adminlogin.html'" class="tms-btn tms-btn-secondary">
                <i class="fas fa-tools"></i> Admin Portal
            </button>
        </div>
        
        <div class="features">
            <div class="feature">
                <i class="fas fa-gas-pump"></i>
                <h3>Fuel Tracking</h3>
                <p>Monitor fuel consumption</p>
            </div>
            <div class="feature">
                <i class="fas fa-money-bill-wave"></i>
                <h3>Allowances</h3>
                <p>Manage driver allowances</p>
            </div>
            <div class="feature">
                <i class="fas fa-truck-pickup"></i>
                <h3>Truck List</h3>
                <p>View all vehicles</p>
            </div>
            <div class="feature">
                <i class="fas fa-users"></i>
                <h3>Drivers</h3>
                <p>Driver management</p>
            </div>
        </div>
    </div>

    <script>
        // Theme switching functionality
        document.addEventListener('DOMContentLoaded', function() {
            const themeButtons = document.querySelectorAll('.theme-btn');
            const body = document.body;
            
            // Define color schemes for each blue theme
            const themes = {
                midnight: {
                    primary: '#0f1b3a',
                    secondary: '#1c3b6a',
                    accent: '#2c5282',
                    buttonPrimary: '#2c5282',
                    buttonSecondary: '#2ecc71'
                },
                navy: {
                    primary: '#001f3f',
                    secondary: '#003366',
                    accent: '#00509e',
                    buttonPrimary: '#00509e',
                    buttonSecondary: '#2ecc71'
                },
                royal: {
                    primary: '#1e3c72',
                    secondary: '#2a5298',
                    accent: '#3498db',
                    buttonPrimary: '#3498db',
                    buttonSecondary: '#2ecc71'
                },
                sapphire: {
                    primary: '#082567',
                    secondary: '#0d4b9c',
                    accent: '#1261b1',
                    buttonPrimary: '#1261b1',
                    buttonSecondary: '#2ecc71'
                },
                ocean: {
                    primary: '#005b96',
                    secondary: '#0077be',
                    accent: '#0096ff',
                    buttonPrimary: '#0096ff',
                    buttonSecondary: '#2ecc71'
                },
                sky: {
                    primary: '#0077be',
                    secondary: '#0096ff',
                    accent: '#00bfff',
                    buttonPrimary: '#00bfff',
                    buttonSecondary: '#2ecc71'
                },
                steel: {
                    primary: '#4682b4',
                    secondary: '#5f9ea0',
                    accent: '#70a8c9',
                    buttonPrimary: '#70a8c9',
                    buttonSecondary: '#2ecc71'
                },
                azure: {
                    primary: '#007fff',
                    secondary: '#00bfff',
                    accent: '#40e0d0',
                    buttonPrimary: '#40e0d0',
                    buttonSecondary: '#2ecc71'
                },
                cobalt: {
                    primary: '#0047ab',
                    secondary: '#1e90ff',
                    accent: '#4aa8ff',
                    buttonPrimary: '#4aa8ff',
                    buttonSecondary: '#2ecc71'
                },
                denim: {
                    primary: '#1560bd',
                    secondary: '#1e90ff',
                    accent: '#4aa8ff',
                    buttonPrimary: '#4aa8ff',
                    buttonSecondary: '#2ecc71'
                }
            };
            
            // Set initial theme
            setTheme('royal');
            
            // Add event listeners to theme buttons
            themeButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const theme = this.getAttribute('data-theme');
                    
                    // Update active button
                    themeButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Apply theme
                    setTheme(theme);
                });
            });
            
            function setTheme(themeName) {
                const theme = themes[themeName];
                
                // Update CSS custom properties
                document.documentElement.style.setProperty('--primary-color', theme.primary);
                document.documentElement.style.setProperty('--secondary-color', theme.secondary);
                document.documentElement.style.setProperty('--accent-color', theme.accent);
                document.documentElement.style.setProperty('--button-primary', theme.buttonPrimary);
                document.documentElement.style.setProperty('--button-secondary', theme.buttonSecondary);
                
                // Update body class for theme-specific adjustments
                body.className = `theme-${themeName}`;
            }
            
            // Add interactive effects
            const buttons = document.querySelectorAll('.tms-btn');
            const features = document.querySelectorAll('.feature');
            const truckIcons = document.querySelectorAll('.truck-icon');
            
            buttons.forEach(button => {
                button.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-5px) scale(1.03)';
                });
                
                button.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';
                });
            });
            
            // Add click effect
            buttons.forEach(button => {
                button.addEventListener('mousedown', function() {
                    this.style.transform = 'translateY(-2px) scale(0.98)';
                });
                
                button.addEventListener('mouseup', function() {
                    this.style.transform = 'translateY(-5px) scale(1.03)';
                });
            });
            
            // Add feature hover effects
            features.forEach(feature => {
                feature.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-5px)';
                });
                
                feature.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0)';
                });
            });
            
            // Add truck icon hover effects
            truckIcons.forEach(icon => {
                icon.addEventListener('mouseenter', function() {
                    this.style.animation = 'pulse 0.5s ease-in-out, glow 1.5s ease-in-out infinite alternate';
                });
                
                icon.addEventListener('mouseleave', function() {
                    this.style.animation = 'float 3s ease-in-out infinite';
                    this.style.animationDelay = getComputedStyle(this).animationDelay;
                });
            });
        });
    </script>
</body>
</html>
