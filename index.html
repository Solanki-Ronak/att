<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 10px;
        }

        .tms-container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            padding: 2rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .tms-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            z-index: -1;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.8rem;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            color: white;
        }

        .subtitle {
            font-size: 1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .tms-btn {
            padding: 1rem 2rem;
            font-size: 1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .tms-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: all 0.6s ease;
        }

        .tms-btn:hover::before {
            left: 100%;
        }

        .tms-btn-primary {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
        }

        .tms-btn-secondary {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            color: white;
        }

        .tms-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .tms-btn:active {
            transform: translateY(0);
        }

        .truck-icons {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: nowrap;
            gap: 0.5rem;
            margin: 2rem 0;
        }

        .truck-icon {
            font-size: 2.5rem;
            color: white;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
            flex: 1;
            text-align: center;
        }

        .truck-icon:nth-child(1) {
            animation-delay: 0s;
        }

        .truck-icon:nth-child(2) {
            animation-delay: 0.5s;
        }

        .truck-icon:nth-child(3) {
            animation-delay: 1s;
        }

        .truck-icon:nth-child(4) {
            animation-delay: 1.5s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-10px) rotate(3deg);
            }
        }

        .truck-icon:hover {
            animation: pulse 0.5s ease-in-out, glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
            }
            to {
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.7));
            }
        }

        .road {
            height: 3px;
            background: linear-gradient(90deg, transparent, #3498db, transparent);
            margin: 1.5rem 0;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .road::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            animation: roadShine 3s infinite;
        }

        @keyframes roadShine {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .feature {
            background: rgba(255, 255, 255, 0.15);
            padding: 1rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-width: 0;
        }

        .feature:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .feature i {
            font-size: 1.8rem;
            margin-bottom: 0.8rem;
            color: white;
        }

        .feature h3 {
            font-size: 0.95rem;
            margin-bottom: 0.4rem;
        }

        .feature p {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Tablet Styles */
        @media (min-width: 769px) {
            h1 {
                font-size: 3rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
                margin-bottom: 3rem;
            }
            
            .tms-btn {
                padding: 1.2rem 2.5rem;
                font-size: 1.1rem;
            }
            
            .truck-icon {
                font-size: 3.5rem;
            }
            
            .features {
                grid-template-columns: repeat(4, 1fr);
                gap: 1.5rem;
                margin-top: 2rem;
            }
            
            .feature {
                padding: 1.5rem;
            }
            
            .feature i {
                font-size: 2.5rem;
            }
            
            .feature h3 {
                font-size: 1.1rem;
            }
            
            .feature p {
                font-size: 0.9rem;
            }
        }

        /* For very small mobile screens */
        @media (max-width: 350px) {
            .tms-container {
                padding: 1.5rem 1rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .truck-icon {
                font-size: 2rem;
            }
            
            .tms-btn {
                padding: 0.8rem 1.5rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="tms-container">
        <h1><i class="fas fa-truck-moving"></i> Truck Management System</h1>
        <p class="subtitle">Efficient logistics and fleet management solutions</p>
        
        <div class="truck-icons">
            <div class="truck-icon"><i class="fas fa-gas-pump"></i></div>
            <div class="truck-icon"><i class="fas fa-money-bill-wave"></i></div>
            <div class="truck-icon"><i class="fas fa-truck-pickup"></i></div>
            <div class="truck-icon"><i class="fas fa-users"></i></div>
        </div>
        
        <div class="road"></div>
        
        <div class="button-group">
            <button onclick="window.location.href='employee/index.html'" class="tms-btn tms-btn-primary">
                <i class="fas fa-user-tie"></i> Employee Portal
            </button>
           <button onclick="window.location.href='admin/adminlogin.html'" class="tms-btn tms-btn-secondary">
                <i class="fas fa-tools"></i> Admin Portal
            </button>
        </div>
        
        <div class="features">
            <div class="feature">
                <i class="fas fa-gas-pump"></i>
                <h3>Fuel Tracking</h3>
                <p>Monitor fuel consumption</p>
            </div>
            <div class="feature">
                <i class="fas fa-money-bill-wave"></i>
                <h3>Allowances</h3>
                <p>Manage driver allowances</p>
            </div>
            <div class="feature">
                <i class="fas fa-truck-pickup"></i>
                <h3>Truck List</h3>
                <p>View all vehicles</p>
            </div>
            <div class="feature">
                <i class="fas fa-users"></i>
                <h3>Drivers</h3>
                <p>Driver management</p>
            </div>
        </div>
    </div>

    <script>
        // Add some interactive effects
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.tms-btn');
            const features = document.querySelectorAll('.feature');
            const truckIcons = document.querySelectorAll('.truck-icon');
            
            buttons.forEach(button => {
                button.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-5px) scale(1.03)';
                });
                
                button.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';
                });
            });
            
            // Add click effect
            buttons.forEach(button => {
                button.addEventListener('mousedown', function() {
                    this.style.transform = 'translateY(-2px) scale(0.98)';
                });
                
                button.addEventListener('mouseup', function() {
                    this.style.transform = 'translateY(-5px) scale(1.03)';
                });
            });
            
            // Add feature hover effects
            features.forEach(feature => {
                feature.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-5px)';
                });
                
                feature.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0)';
                });
            });
            
            // Add truck icon hover effects
            truckIcons.forEach(icon => {
                icon.addEventListener('mouseenter', function() {
                    this.style.animation = 'pulse 0.5s ease-in-out, glow 1.5s ease-in-out infinite alternate';
                });
                
                icon.addEventListener('mouseleave', function() {
                    this.style.animation = 'float 3s ease-in-out infinite';
                    this.style.animationDelay = getComputedStyle(this).animationDelay;
                });
            });
        });
    </script>
</body>
</html>
