<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Truck Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #001f3f;
            --secondary-color: #003366;
            --accent-color: #00509e;
            --button-primary: #00509e;
            --button-secondary: #2ecc71;
            --text-color: white;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
            transition: all 0.5s ease;
        }

        .login-container {
            width: 90%;
            max-width: 450px;
            text-align: center;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            z-index: -1;
        }

        /* Back button positioned at top right */
        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 40px;
            z-index: 10;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            color: var(--text-color);
            margin-top: 0.5rem;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            position: relative;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .form-group i {
            position: absolute;
            left: 1rem;
            top: 67%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }

        .login-btn {
            padding: 1.2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 600;
            background: linear-gradient(45deg, var(--button-primary), color-mix(in srgb, var(--button-primary) 80%, black));
            color: white;
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: all 0.6s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }

        .login-btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        /* Button animation effects */
        @keyframes buttonPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 80, 158, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(0, 80, 158, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(0, 80, 158, 0);
            }
        }

        .login-btn:hover {
            animation: buttonPulse 1.5s infinite;
        }

        .message {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }

        .message.error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            display: block;
        }

        .message.success {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid rgba(0, 255, 0, 0.5);
            display: block;
        }

        .truck-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
            color: white;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-10px) rotate(3deg);
            }
        }

        .truck-icon:hover {
            animation: pulse 0.5s ease-in-out, glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
            }
            to {
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.7));
            }
        }

        /* Road animation */
        .road {
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            margin: 1.5rem 0;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .road::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            animation: roadShine 3s infinite;
        }

        @keyframes roadShine {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        /* Shake animation for errors */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 2rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .form-group input {
                padding: 0.8rem 0.8rem 0.8rem 2.5rem;
            }
            
            .form-group i {
                left: 0.8rem;
                top: 67%;
                transform: translateY(-50%);
            }
            
            .login-btn {
                padding: 1rem;
                font-size: 1.1rem;
                min-height: 55px;
            }
            
            .back-btn {
                padding: 0.5rem 0.8rem;
                font-size: 0.8rem;
                min-height: 35px;
                top: 15px;
                right: 15px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .truck-icon {
                font-size: 2.5rem;
            }
            
            .form-group i {
                left: 0.8rem;
                top: 67%;
                transform: translateY(-50%);
            }
            
            .login-btn {
                padding: 0.9rem;
                font-size: 1rem;
            }
            
            .back-btn {
                padding: 0.4rem 0.7rem;
                font-size: 0.75rem;
                min-height: 32px;
                top: 12px;
                right: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Back button positioned at top right -->
        <button class="back-btn" onclick="window.location.href='../index.html'">
            <i class="fas fa-arrow-left"></i> Back
        </button>
        
        <div class="truck-icon">
            <i class="fas fa-tools"></i>
        </div>
        <h1>Admin Portal</h1>
        <p class="subtitle">Secure access for administrators</p>
        
        <div class="road"></div>
        
        <div id="message" class="message"></div>
        
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
    </div>

    <script>
        // Initialize Supabase client
        const supabaseUrl = "https://znfyskpqbgcnxxhdwwqi.supabase.co";
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZnlza3BxYmdjbnh4aGR3d3FpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3NjQ5NTUsImV4cCI6MjA3NjM0MDk1NX0.oWup1BSPN3QM-Rpz7FScsyuBykFwAHy2uW8EYpi4R50";
        
        // Create Supabase client
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const messageDiv = document.getElementById('message');
            
            // Test Supabase connection
            async function testConnection() {
                try {
                    console.log('Testing Supabase connection...');
                    const { data, error } = await supabase
                        .from('admin_users')
                        .select('count', { count: 'exact', head: true });
                    
                    if (error) {
                        console.error('Supabase connection test failed:', error);
                        return false;
                    }
                    
                    console.log('Supabase connection successful');
                    return true;
                } catch (error) {
                    console.error('Supabase connection test error:', error);
                    return false;
                }
            }

            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
                
                // Clear previous messages
                messageDiv.className = 'message';
                messageDiv.style.display = 'none';
                
                // Show loading state
                const loginBtn = loginForm.querySelector('.login-btn');
                const originalBtnText = loginBtn.innerHTML;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
                loginBtn.disabled = true;
                
                try {
                    // Test connection first
                    const isConnected = await testConnection();
                    if (!isConnected) {
                        throw new Error('Database connection failed. Please try again.');
                    }

                    console.log('Checking credentials for:', username);
                    
                    // Query the admin_users table to check credentials
                    const { data, error } = await supabase
                        .from('admin_users')
                        .select('*')
                        .eq('username', username)
                        .eq('is_active', true)
                        .single();
                    
                    if (error) {
                        console.error('Supabase query error:', error);
                        // If no user found
                        if (error.code === 'PGRST116') {
                            throw new Error('Invalid username or password!');
                        }
                        throw new Error('Authentication failed. Please try again.');
                    }
                    
                    if (!data) {
                        throw new Error('Invalid username or password!');
                    }
                    
                    console.log('User found:', data.username);
                    
                    // Check if password matches
                    if (data.password === password) {
                        // Successful login
                        messageDiv.textContent = 'Login successful! Redirecting...';
                        messageDiv.className = 'message success';
                        messageDiv.style.display = 'block';
                        
                        // Store login state in localStorage
                        localStorage.setItem('adminLoggedIn', 'true');
                        localStorage.setItem('adminUsername', username);
                        
                        // Redirect to admin dashboard
                        setTimeout(function() {
                            window.location.href = 'index.html';
                        }, 1000);
                    } else {
                        throw new Error('Invalid username or password!');
                    }
                    
                } catch (error) {
                    // Failed login
                    console.error('Login error:', error);
                    messageDiv.textContent = error.message;
                    messageDiv.className = 'message error';
                    messageDiv.style.display = 'block';
                    
                    // Shake animation for error
                    loginForm.style.animation = 'shake 0.5s';
                    setTimeout(() => {
                        loginForm.style.animation = '';
                    }, 500);
                } finally {
                    // Reset button state
                    loginBtn.innerHTML = originalBtnText;
                    loginBtn.disabled = false;
                }
            });
            
            // Test connection on page load
            testConnection();
        });
    </script>
</body>
</html>
